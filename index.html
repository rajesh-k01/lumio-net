<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumio Enhancer</title>
<!--
  GitHub Pages entry point.

  The app itself lives in site/ — one self-contained folder that can be
  published to any static host. This page is what GitHub Pages serves when
  the source is "Deploy from a branch -> main -> / (root)": it sends you

  If you publish site/ as the root of your own site, this file is not
  needed at all.
-->
<meta http-equiv="refresh" content="0; url=./site/">
<link rel="canonical" href="./site/">
<meta name="description" content="Free photo enhancer. Upscale to HD, 2K or 4K and sharpen detail, right in your browser.">
<meta name="theme-color" content="#0c2d57">
<link rel="icon" href="./site/favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0c2d57; color: #eaf2fb;
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { text-align: center; padding: 2rem; }
  h1 { margin: 0 0 .4rem; font-size: 1.6rem; letter-spacing: -.01em; }
  p { margin: 0 0 1.4rem; opacity: .8; }
  a.btn {
    display: inline-block; padding: .7rem 1.3rem; border-radius: 10px;
    background: #f2a03d; color: #14181f; font-weight: 650; text-decoration: none;
  }
  a.btn:hover { background: #ffb254; }
  svg { display: block; margin: 0 auto 1rem; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 32 32" width="40" height="40" aria-hidden="true">
    <g fill="none" stroke="currentColor" stroke-width="2.4">
      <rect x="5" y="5" width="9" height="9"/><rect x="18" y="5" width="9" height="9"/>
      <rect x="5" y="18" width="9" height="9"/>
    </g>
    <rect x="18" y="18" width="9" height="9" fill="#f2a03d"/>
  </svg>
  <h1>Lumio Enhancer</h1>
  <p>Taking you to the app…</p>
  <a class="btn" href="./site/">Open Lumio</a>

<script>location.replace("./site/");</script>
